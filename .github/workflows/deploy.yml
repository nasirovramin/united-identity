name: Deploy United Identity Worker

on:
  push:
    branches:
      - main.ru
    paths-ignore:
      # The hourly source refresh workflow deploys this snapshot itself.
      - "src/generated/the-brand-identity-snapshot.js"
      - ".github/workflows/health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: united-identity-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run offline checks
        run: npm test

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify empty source layer
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://united-identity.nasirovramin.workers.dev/health

      - name: Probe The Brand Identity directly from GitHub runner
        continue-on-error: true
        run: |
          code=$(curl -L --silent --show-error --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -o /tmp/tbi-features.html \
            -w "%{http_code}" \
            https://the-brandidentity.com/features)
          echo "TBI_DIRECT_HTTP=$code"
          echo "TBI_DIRECT_BYTES=$(wc -c </tmp/tbi-features.html 2>/dev/null || echo 0)"
          test "$code" = "200"

      - name: Probe Jina Reader fallback
        continue-on-error: true
        run: |
          code=$(curl -L --silent --show-error --max-time 90 \
            -A "Mozilla/5.0" \
            -o /tmp/tbi-jina.txt \
            -w "%{http_code}" \
            https://r.jina.ai/https://the-brandidentity.com/features)
          echo "TBI_JINA_HTTP=$code"
          echo "TBI_JINA_BYTES=$(wc -c </tmp/tbi-jina.txt 2>/dev/null || echo 0)"
          head -c 800 /tmp/tbi-jina.txt || true
          echo
          test "$code" = "200"

      - name: Smoke test The Brand Identity
        continue-on-error: true
        run: |
          response=$(curl --silent --show-error --max-time 90 -w "\nHTTP_STATUS:%{http_code}" \
            https://united-identity.nasirovramin.workers.dev/test/the-brand-identity)
          echo "$response"
          status=$(printf "%s\n" "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          if [ -z "$status" ] || [ "$status" -ge 400 ]; then
            exit 1
          fi

      - name: Repair and verify The Brand Identity article viewer test
        continue-on-error: true
        run: |
          response=$(curl --silent --show-error --max-time 180 -w "\nHTTP_STATUS:%{http_code}" \
            https://united-identity.nasirovramin.workers.dev/repair-test/the-brand-identity)
          echo "$response"
          status=$(printf "%s\n" "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          json=$(printf "%s\n" "$response" | sed '/^HTTP_STATUS:/d')
          details=$(printf "%s" "$json" | jq -r '.detailsUrl // empty')
          if [ -z "$status" ] || [ "$status" -ge 400 ] || [ -z "$details" ]; then
            exit 1
          fi
          echo "VERIFY_DETAILS=$details"
          curl --fail --silent --show-error --max-time 90 "$details" -o /tmp/identity-article.html
          bytes=$(wc -c </tmp/identity-article.html)
          echo "VIEWER_BYTES=$bytes"
          test "$bytes" -gt 1000

