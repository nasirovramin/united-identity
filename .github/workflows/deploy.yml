name: Deploy United Identity Worker

on:
  push:
    branches:
      - main.ru
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Azerbaijani AI translation
        run: |
          echo "Running Workers AI translation self-test..."
          response=$(curl --silent --show-error --max-time 180 -w "\nHTTP_STATUS:%{http_code}" \
            https://united-identity.nasirovramin.workers.dev/self-test)
          echo "$response"
          status=$(printf "%s\n" "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          if [ -z "$status" ] || [ "$status" -ge 400 ]; then
            exit 1
          fi

      - name: Repair untranslated Telegram captions
        run: |
          echo "Repairing known untranslated United Identity posts..."
          curl --fail --silent --show-error --max-time 120 \
            https://united-identity.nasirovramin.workers.dev/repair-az

      - name: Trigger one immediate production scan
        run: |
          echo "Triggering United Identity scan..."
          curl --fail --silent --show-error --max-time 180 \
            https://united-identity.nasirovramin.workers.dev/scan

