name: Deploy United Identity Worker

on:
  push:
    branches:
      - main.ru
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: united-identity-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify empty source layer
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://united-identity.nasirovramin.workers.dev/health

      - name: Smoke test The Brand Identity
        continue-on-error: true
        run: |
          response=$(curl --silent --show-error --max-time 90 -w "\nHTTP_STATUS:%{http_code}" \
            https://united-identity.nasirovramin.workers.dev/test/the-brand-identity)
          echo "$response"
          status=$(printf "%s\n" "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
          if [ -z "$status" ] || [ "$status" -ge 400 ]; then
            exit 1
          fi
