name: United Identity Health

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Worker health
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://united-identity.nasirovramin.workers.dev/health \
            -o health.json
          node - <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("health.json","utf8"));
          if(!d.ok) throw new Error("Worker is unhealthy");
          if(d.webSources!==0 || d.telegramSources!==0 || d.linkedinSources!==0){
            throw new Error("Source layer is not empty");
          }
          console.log("United Identity source layer is empty and healthy.");
          NODE
