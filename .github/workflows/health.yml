name: United Identity Health

on:
  push:
    branches: [main.ru]
    paths:
      - ".github/workflows/health.yml"
      - "src/**"
      - "wrangler.jsonc"
  schedule:
    - cron: "15 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Worker health and source runtime
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --max-time 60 \
            https://united-identity.nasirovramin.workers.dev/health \
            -o health.json

          curl --fail --silent --show-error --max-time 90 \
            https://united-identity.nasirovramin.workers.dev/status/the-brand-identity \
            -o source-status.json

          node - <<'NODE'
          const fs=require("fs");
          const h=JSON.parse(fs.readFileSync("health.json","utf8"));
          const s=JSON.parse(fs.readFileSync("source-status.json","utf8"));

          if(!h.ok) throw new Error("Worker is unhealthy");
          if(!h.sourceCount || h.sourceCount.web < 1){
            throw new Error("The Brand Identity source is not registered");
          }
          if(!h.automaticScanning || !h.publishing){
            throw new Error("Automatic source scanning/publishing is disabled");
          }
          if(!s.ok) throw new Error("The Brand Identity runtime status is unhealthy");

          console.log("HEALTH="+JSON.stringify(h));
          console.log("SOURCE_STATUS="+JSON.stringify(s));

          if(s.lastError){
            console.log("LAST_SOURCE_ERROR="+JSON.stringify(s.lastError));
          }
          NODE
